<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Kaspi.kz</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json">
  <style>
    #preview {
      display: none;
      width: min(calc(100vw - 32px), 560px);
      aspect-ratio: 1.585 / 1;
      overflow: hidden;
      touch-action: none;
      position: relative;
      border-radius: 12px;
      background: #f2f2f2;
    }

    #preview.has-image { display: block; }

    .zoomable-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: inherit;
      touch-action: none;
      user-select: none;
      transform-origin: center;
    }

    .copy-icon {
      height: 18px !important;
      width: 22px !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">
        <img src="arrow.png" alt="" class="back-icon" />
        <h1 class="text-title">Удостоверение личности</h1>
      </div>

      <div class="tab">
        <div class="btntab">
          <input type="radio" name="tab-btn" id="tab-btn-1" value="doc" checked />
          <label for="tab-btn-1">Документ</label>

          <input type="radio" name="tab-btn" id="tab-btn-2" value="req" />
          <label for="tab-btn-2">Реквизиты</label>
        </div>
      </div>
    </div>

    <div id="doc" class="tab-content active">
      <div class="middle">
        <div class="img-upload">
          <div class="input-img" id="upload-container">
            <input type="file" name="img-upl" id="idupload" class="input-file" accept="image/*" />
            <label for="idupload" id="upload-label"><span>Загрузить</span></label>
          </div>
          <div id="preview"></div>
        </div>
      </div>

      <div class="footer">
        <div class="btnfooter" id="docbtn">
          <button id="btnftr1">
            <img src="qr.png" alt="" class="qrbtn" />
            Предъявить документ
          </button>
          <button id="btnftr2" class="share">
            <img src="upload.png" alt="" class="uploadbtn" />
            Отправить документ
          </button>
        </div>
      </div>
    </div>

    <div id="req" class="tab-content">
      <ul class="rekvizit">
        <li>
          <span class="atritem">ФИО</span>
          <input type="text" maxlength="32" spellcheck="false" class="rekitem" id="1"/>
          <img src="copy.png" alt="" class="copy-icon" />
        </li>
        <li>
          <span class="atritem">ИИН</span>
          <input type="text" maxlength="12" class="rekitem" id="2"/>
          <img src="copy.png" alt="" class="copy-icon"  />
        </li>
        <li>
          <span class="atritem">Дата рождения</span>
          <input type="text" maxlength="10" class="rekitem" id="3"/>
          <img src="copy.png" alt="" class="copy-icon" />
        </li>
        <li>
          <span class="atritem">Номер документа</span>
          <input type="text" maxlength="9" class="rekitem" id="4"/>
          <img src="copy.png" alt="" class="copy-icon" />
        </li>
        <li>
          <span class="atritem">Дата выдачи</span>
          <input type="text" maxlength="10" class="rekitem" id="5"/>
          <img src="copy.png" alt="" class="copy-icon" />
        </li>
        <li>
          <span class="atritem">Срок действия</span>
          <input type="text" maxlength="10" class="rekitem" id="6"/>
          <img src="copy.png" alt="" class="copy-icon" />
        </li>
      </ul>
      <div class="footer">
        <div class="btnfooter" id="docbtn">
          <button id="btnftr2" class="share">
            <img src="upload.png" alt="" class="uploadbtn" />
            Отправить реквизиты
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const radioDoc = document.getElementById("tab-btn-1");
    const radioReq = document.getElementById("tab-btn-2");

    const docSection = document.getElementById("doc");
    const reqSection = document.getElementById("req");

    radioDoc.addEventListener("change", () => {
      if (radioDoc.checked) {
        docSection.classList.add("active");
        reqSection.classList.remove("active");
      }
    });

    radioReq.addEventListener("change", () => {
      if (radioReq.checked) {
        reqSection.classList.add("active");
        docSection.classList.remove("active");
      }
    });

    const input = document.getElementById("idupload");
    const label = document.getElementById("upload-label");
    const preview = document.getElementById("preview");

    function showImage(source) {
      const img = document.createElement("img");
      img.src = source;
      img.alt = "Загруженный документ";
      img.className = "zoomable-image";
      preview.replaceChildren(img);
      preview.classList.add("has-image");
      label.style.display = "none";

      let lastScale = 1;
      let currentScale = 1;
      img.addEventListener("touchstart", function (e) {
        if (e.touches.length !== 2) return;
        lastScale = Math.hypot(
          e.touches[0].pageX - e.touches[1].pageX,
          e.touches[0].pageY - e.touches[1].pageY
        );
      });

      img.addEventListener("touchmove", function (e) {
        if (e.touches.length !== 2) return;
        e.preventDefault();
        const newScale = Math.hypot(
          e.touches[0].pageX - e.touches[1].pageX,
          e.touches[0].pageY - e.touches[1].pageY
        );
        currentScale = Math.min(Math.max(1, currentScale * (newScale / lastScale)), 5);
        img.style.transform = `scale(${currentScale})`;
        lastScale = newScale;
      });
      return img;
    }

    try {
      const savedImage = localStorage.getItem("uploadedImage");
      if (savedImage) showImage(savedImage);
    } catch (_) {
      // Предпросмотр работает и без доступа к localStorage.
    }

    input.addEventListener("change", function () {
      const file = this.files && this.files[0];
      if (!file || !file.type.startsWith("image/")) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        showImage(e.target.result);
        try { localStorage.setItem("uploadedImage", e.target.result); } catch (_) {}
      };
      reader.readAsDataURL(file);
    });

    let scale = 1;
    preview.addEventListener("wheel", (e) => {
      const img = preview.querySelector("img");
      if (!img) return;
      e.preventDefault();
      const rect = img.getBoundingClientRect();
      const originX = e.clientX - rect.left;
      const originY = e.clientY - rect.top;
      img.style.transformOrigin = `${originX}px ${originY}px`;
      scale += e.deltaY * -0.001;
      scale = Math.min(Math.max(1, scale), 5);
      img.style.transform = `scale(${scale})`;
    });
  </script>
</body>
</html>
